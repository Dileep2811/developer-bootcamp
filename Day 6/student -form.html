<!DOCTYPE html>
<html>
<head><title>Student Form</title></head>
<body>
  <h2>Student Registration</h2>
  <form id="studentForm">
    <input type="text" id="name" placeholder="Name" required><br><br>
    <input type="email" id="email" placeholder="Email" required><br><br>
    <input type="tel" id="phone" placeholder="Phone" required><br><br>
    <button type="submit">Submit</button>
  </form>
  <div id="output"></div>

  <script>
  document.getElementById('studentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    document.getElementById('output').innerHTML = `<p><strong>Name:</strong> ${name}</p><p><strong>Email:</strong> ${email}</p><p><strong>Phone:</strong> ${phone}</p>`;
  });
  </script>
</body>
</html>
