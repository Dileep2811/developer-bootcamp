<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Clone</title>
  <link rel="stylesheet" href="google-clone.css">
</head>

<body>
  <!-- Header Section: Navigation and Actions -->
  <header>
    <a href="#" class="nav-link">Gmail</a>
    <a href="#" class="nav-link">Images</a>

    <!-- Google Apps Grid Icon -->
    <div class="nav-apps" title="Google apps">
      <svg class="apps-icon" focusable="false" viewBox="0 0 24 24" width="24" height="24">
        <path
          d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"
          fill="#5f6368"></path>
      </svg>
    </div>

    <button class="nav-btn">Sign in</button>
  </header>

  <!-- Main Content: Logo and Search Form -->
  <main>
    <div class="logo-container">
      <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo"
        width="272" height="92">
    </div>

    <form class="search-form" action="#" method="GET" role="search">
      <!-- Search Input Container with Icons -->
      <div class="search-box-wrapper">
        <div class="search-icon">
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path
              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              fill="#9aa0a6"></path>
          </svg>
        </div>

        <input class="search-input" type="text" name="q" autocomplete="off" aria-label="Search"
          placeholder="Search Google or type a URL" required autofocus>

        <div class="search-actions">
          <!-- Voice Search Icon -->
          <button class="action-btn" type="button" aria-label="Search by voice" title="Search by voice">
            <svg class="goxjub" focusable="false" viewBox="0 0 24 24" width="24" height="24"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"
                fill="#4285f4"></path>
              <path d="m11 18.08h2v3.92h-2z" fill="#34a853"></path>
              <path d="m7.05 16.87c-1.27-1.33-2.05-3.12-2.05-5.09h2c0 1.38.56 2.63 1.46 3.55l-1.41 1.54z"
                fill="#f4b400"></path>
              <path
                d="m12 18c-3.11 0-5.62-2.51-5.62-5.62h2c0 2 1.62 3.62 3.62 3.62s3.62-1.62 3.62-3.62h2c0 3.11-2.51 5.62-5.62 5.62z"
                fill="#ea4335"></path>
            </svg>
          </button>
          <!-- Lens Search Icon -->
          <button class="action-btn" type="button" aria-label="Search by camera" title="Search by camera">
            <svg class="Gdd5U" focusable="false" viewBox="0 0 192 192" width="24" height="24"
              xmlns="http://www.w3.org/2000/svg">
              <rect fill="none" height="192" width="192"></rect>
              <g>
                <path
                  d="M153,60c-2.8,0-5.1-2.2-5.1-5c0-18.7-15.2-34-34-34c-2.8,0-5-2.2-5-5s2.2-5,5-5c24.2,0,44,19.8,44,44C158,57.8,155.8,60,153,60z"
                  fill="#4285f4"></path>
                <path
                  d="M153,161c0,2.8-2.2,5-5,5c-24.2,0-44-19.8-44-44c0-2.8,2.2-5,5-5s5,2.2,5,5c0,18.7,15.2,34,34,34C150.8,156,153,158.2,153,161z"
                  fill="#34a853"></path>
                <path
                  d="M39,122c0-2.8,2.2-5,5-5s5,2.2,5,5c0,18.7,15.2,34,34,34c2.8,0,5,2.2,5,5s-2.2,5-5,5C58.8,166,39,146.2,39,122z"
                  fill="#f4b400"></path>
                <path
                  d="M83,31c0,2.8-2.2,5-5,5c-18.7,0-34,15.3-34,34c0,2.8-2.2,5-5,5s-5-2.2-5-5c0-24.2,19.8-44,44-44C80.8,26,83,28.2,83,31z"
                  fill="#ea4335"></path>
                <path d="M125,96c0,16-13,29-29,29S67,112,67,96s13-29,29-29S125,80,125,96z" fill="#4285f4"></path>
                <path d="M139,96c0,23.7-19.3,43-43,43s-43-19.3-43-43s19.3-43,43-43S139,72.3,139,96z" fill="#ea4335">
                </path>
                <path d="M149,96c0,29.3-23.7,53-53,53S43,125.3,43,96s23.7-53,53-53S149,66.7,149,96z" fill="#f4b400">
                </path>
              </g>
            </svg>
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="buttons-container">
        <button class="btn-search" type="submit">Google Search</button>
        <button class="btn-search" type="button" id="btn-clear">Clear</button>
      </div>
    </form>
  </main>

  <!-- Footer Section: Country and Links -->
  <footer>
    <div class="footer-top">
      <span>India</span>
    </div>
    <div class="footer-bottom">
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>

  <!-- Clear Button Behavior Script -->
  <script>
    document.getElementById('btn-clear').addEventListener('click', () => {
      document.querySelector('.search-input').value = '';
      document.querySelector('.search-input').focus();
    });
  </script>
</body>

</html>
