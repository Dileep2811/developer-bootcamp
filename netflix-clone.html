<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="netflix-clone.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h1 class="logo">NETFLIX</h1>
    <button class="signin-btn">Sign In</button>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Unlimited movies, TV shows and more</h1>
      <p>Starts at ₹149. Cancel anytime.</p>
      <button class="cta-btn">Get Started</button>
    </div>
  </section>

  <!-- Features Section -->
  <section class="features">
    <div class="feature-card">
      <h2>Watch on TV</h2>
      <p>Smart TVs, PlayStation, Xbox, Chromecast, Apple TV</p>
    </div>
    <div class="feature-card">
      <h2>Download offline</h2>
      <p>Save your favourites easily</p>
    </div>
    <div class="feature-card">
      <h2>Watch everywhere</h2>
      <p>Stream on phone, tablet, laptop, TV</p>
    </div>
  </section>
</body>
</html>
