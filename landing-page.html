<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Landing Page</title>
  <link rel="stylesheet" href="landing-page.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">MySite</div>
    <nav class="nav-links">
      <a href="#hero">Home</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="hero">
    <h1>Welcome to My Landing Page</h1>
    <p>Build stuff. Learn stuff. Get better.</p>
    <button>Get Started</button>
  </section>

  <!-- Features Section -->
  <section id="features" class="features">
    <h2>Features</h2>
    <div class="feature-box">
      <div class="feature">
        <h3>Fast</h3>
        <p>Loads quickly on all devices</p>
      </div>
      <div class="feature">
        <h3>Responsive</h3>
        <p>Looks good on phone + desktop</p>
      </div>
      <div class="feature">
        <h3>Simple</h3>
        <p>Clean code you can understand</p>
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="contact">
    <h2>Contact Me</h2>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <button>Send</button>
  </section>

</body>
</html>
